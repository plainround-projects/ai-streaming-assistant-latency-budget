[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-streaming-assistant-latency-budget"
version = "0.1.0"
description = "A streaming support assistant with Stop, real citations, seven failure states, a pause-for-approval path with a hash-chained audit log, and a first-token budget proven under load."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "anthropic>=2.3,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
]

[project.scripts]
streaming-assistant = "streaming_assistant.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"streaming_assistant" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["streaming_assistant.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "D100", "D101", "D103", "D104"]
# The formatter owns line length; it cannot split long string literals (prose, data tables), so E501 adds only noise.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PT018"]
"scripts/**" = ["D103"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# Test functions are named for the behavior they check; annotating every one adds noise, not safety.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the real model; needs ANTHROPIC_API_KEY and RUN_LIVE=1 (make test-live)",
    "load: starts a server and sends requests for several seconds (make load-test)",
]

[tool.coverage.run]
source = ["streaming_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "streaming_assistant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> infrastructure -> application -> domain, never upward"
type = "layers"
layers = [
    "streaming_assistant.interfaces",
    "streaming_assistant.infrastructure",
    "streaming_assistant.application",
    "streaming_assistant.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application import no vendor SDK, web framework or database driver"
type = "forbidden"
source_modules = ["streaming_assistant.domain", "streaming_assistant.application"]
forbidden_modules = ["anthropic", "fastapi", "uvicorn", "starlette", "httpx"]
