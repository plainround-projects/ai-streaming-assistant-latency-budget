<text class="name" x="1044" y="208" text-anchor="middle">Reviewer</text>
<text class="sub" x="1044" y="230" text-anchor="middle">/review screen</text>
<path class="store" d="M936 342a108 12 0 0 1 216 0v102a108 12 0 0 1 -216 0z"/>
<path class="rim" d="M936 342a108 12 0 0 0 216 0"/>
