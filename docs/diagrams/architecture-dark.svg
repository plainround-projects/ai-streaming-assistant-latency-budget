<text class="name" x="632" y="484">StreamingModel</text>
<text class="sub" x="632" y="508">scripted_stream.py</text>
<text class="sub" x="632" y="530">recorded_stream.py</text>
<text class="sub" x="632" y="552">claude_stream.py</text>
