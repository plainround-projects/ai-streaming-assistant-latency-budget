<text class="label b t-warn" x="64" y="370">make stop-test</text>
<text class="sub" x="64" y="396">upstream call</text>
<text class="sub" x="64" y="418">cancelled in</text>
<text class="sub" x="64" y="440">5.5 ms</text>
<rect class="svc" x="288" y="176" width="216" height="116" rx="12"/>
<text class="name" x="304" y="208">Server</text>
<text class="sub" x="304" y="232">http.py, static/</text>
<text class="sub" x="304" y="254">POST /ask: SSE</text>
<text class="sub" x="304" y="276">stop, resume, review</text>
