<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="708" viewBox="0 0 1200 708" role="img" aria-labelledby="t d">
<title id="t">One paused run through ai-streaming-assistant-latency-budget</title>
<desc id="d">Seven rows across the Customer, Assistant, SQLite, Review desk and Reviewer lanes. A refund asked for 75 days after delivery routes to pause. The assistant saves the run and audits it and tells the customer it is paused. A reviewer answers, an answer that cites nothing is refused with 422, and a valid answer is stored and audited. After a restart the run resumes with the validated answer in context, and the hash-chained audit log can be verified.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="707" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="706" rx="16"/>
<text class="title" x="48" y="68">One run that pauses for a person</text>
<text class="caption" x="48" y="100">Amber: a reviewer's answer that cites nothing is refused. The paused run survives a server restart.</text>

<rect class="actor" x="406" y="128" width="100" height="48" rx="24"/>
<text class="lane" x="456" y="158" text-anchor="middle">Customer</text>
<rect class="svc" x="541" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="596" y="158" text-anchor="middle">Assistant</text>
<rect class="svc" x="690" y="128" width="100" height="48" rx="10"/>
<text class="lane" x="740" y="158" text-anchor="middle">SQLite</text>
<rect class="svc" x="835" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="890" y="148" text-anchor="middle">Review</text>
<text class="lane" x="890" y="168" text-anchor="middle">desk</text>
<rect class="actor" x="995" y="128" width="110" height="48" rx="24"/>
<text class="lane" x="1050" y="158" text-anchor="middle">Reviewer</text>
<path class="hair" d="M456 176V560M596 176V560M740 176V624M890 176V432M1050 176V432"/>
<path class="hair" d="M66 216V600"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Route the question: pause</text>
<text class="sub" x="96" y="232">policy rule: a refund at 75 days</text>
<rect class="slot" x="590" y="198" width="12" height="36" rx="5"/>
<text class="label t-accent" x="612" y="221">route = pause</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Save the run, tell the customer</text>
<text class="sub" x="96" y="296">audit: received, paused</text>
<path class="sync" d="M596 280H740"/>
<text class="label t-accent" x="608" y="270">save run</text>
<path class="ok" d="M596 280H456"/>
<text class="label t-good" x="468" y="270">paused, done</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">A reviewer answers</text>
<text class="sub" x="96" y="360">cites a section, with an id</text>
<path class="sync" d="M1050 344H890"/>
<text class="label t-accent" x="902" y="334">answer</text>
<path class="sync" d="M890 344H740"/>
<text class="label t-accent" x="752" y="334">validated</text>
<circle class="dot-w" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="404">An answer that cites nothing</text>
<text class="sub" x="96" y="424">refused with a reason</text>
<path class="fail" d="M890 408H1050"/>
<text class="label t-warn" x="902" y="398">422</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="468">The server restarts</text>
<text class="sub" x="96" y="488">everything is in the database</text>
<rect class="slot" x="734" y="454" width="12" height="36" rx="5"/>
<text class="label t-accent" x="756" y="477">restart</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">Resume with the answer</text>
<text class="sub" x="96" y="552">prompt rebuilt, then streamed</text>
<path class="sync" d="M456 536H596"/>
<text class="label t-accent" x="468" y="526">GET resume</text>
<path class="read" d="M740 536H596"/>
<text class="label" x="608" y="526">run + answer</text>
<circle class="dot-g" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="596">Replay the log, verify it</text>
<text class="sub" x="96" y="616">who approved, what was shown</text>
<rect class="slot" x="734" y="582" width="12" height="36" rx="5"/>
<text class="label t-accent" x="756" y="605">verify</text>
<rect class="win" x="430" y="580" width="260" height="40" rx="10"/>
<text class="label b t-good" x="446" y="605">edited entry 1: index 1</text>

<path class="sync" d="M48 664H112"/><text class="legend" x="124" y="669">sync call</text>
<path class="read" d="M520 664H584"/><text class="legend" x="596" y="669">read</text>
<path class="fail" d="M696 664H760"/><text class="legend" x="772" y="669">failure path</text>
<path class="ok" d="M928 664H992"/><text class="legend" x="1004" y="669">result</text>
</svg>
