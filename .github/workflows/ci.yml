name: ci

on: [push, pull_request]

jobs:
  check:
    name: Format, lint, types, import rules, offline tests with coverage, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make check
      - run: make audit

  pipeline:
    name: Trace, the 200 questions, Stop, the pause demo and the tamper demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make up
      - run: make run
      - run: make verify-audit

  image:
    name: Build the server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docker-build
